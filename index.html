<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rodízio de Ovos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>🥚</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="egg-bg" id="eggBg" aria-hidden="true"></div>

  <header>
    <h1>🥚 Rodízio de Ovos</h1>
    <p>Quem compra essa semana, todo mundo come 🍳</p>
  </header>

  <main>
    <div class="draw-meta" id="drawMeta"></div>
    <div id="winnersArea">
      <div class="empty-state">Carregando sorteio…</div>
    </div>

    <section class="cycle-status" id="cycleStatusArea"></section>
  </main>

  <footer></footer>

  <button class="admin-fab" id="openAdminBtn">⚙️ Gerenciar pessoas</button>

  <!-- Modal de login -->
  <div class="modal-overlay" id="loginOverlay" hidden>
    <div class="modal">
      <button class="close-btn" id="closeLoginBtn" aria-label="Fechar">✕</button>
      <h2>Área restrita</h2>
      <p>Digite a senha de administração para cadastrar, editar ou remover pessoas.</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <div class="form-msg" id="loginMsg"></div>
      </form>
    </div>
  </div>

  <!-- Modal de administração -->
  <div class="modal-overlay" id="adminOverlay" hidden>
    <div class="modal">
      <button class="close-btn" id="closeAdminBtn" aria-label="Fechar">✕</button>
      <h2>Gerenciar pessoas</h2>

      <div id="currentDrawAdmin"></div>

      <hr class="sep" />

      <form id="personForm">
        <input type="hidden" id="personId" value="" />
        <div class="field">
          <label for="personName">Nome</label>
          <input type="text" id="personName" required />
        </div>
        <div class="field">
          <label for="personPhone">WhatsApp (DDD + número, sem o 55 — ex: 11999999999)</label>
          <input type="tel" id="personPhone" required pattern="[0-9]{10,11}" />
        </div>
        <div class="field inline">
          <input type="checkbox" id="personActive" checked />
          <label for="personActive">Ativo (participa dos sorteios)</label>
        </div>
        <button type="submit" class="btn btn-primary" id="personSubmitBtn">Adicionar pessoa</button>
        <button type="button" class="btn btn-muted" id="cancelEditBtn" hidden>Cancelar edição</button>
        <div class="form-msg" id="personMsg"></div>
      </form>

      <hr class="sep" />

      <table class="people-table">
        <thead>
          <tr><th>Nome</th><th>WhatsApp</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="peopleTableBody">
          <tr><td colspan="4">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
